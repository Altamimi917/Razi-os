ct-fit:cover;border-radius:16px;background:#171c25;border:1px solid #2c3444}.cover{width:72px;height:100px;object-fit:cover;border-radius:12px;background:#171c25;border:1px solid #2c3444;flex:none}.mediaRow{display:flex;gap:12px;padding:13px;border-bottom:1px solid var(--line)}.mediaRow:last-child{border-bottom:0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:1px solid #303747;background:#151922;color:#b5bdcf;border-radius:999px;padding:8px 11px;white-space:nowrap}.tab.on{background:#eef1ff;color:#08090c;border-color:#eef1ff}.small{font-size:11px;color:#80889c}.empty{padding:22px;text-align:center;color:#8f97aa}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0b0d12;border:1px solid #2a3140;border-radius:14px;padding:11px;overflow:auto}.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b7280;margin-right:6px}.syncdot.on{background:#4ade80}.syncdot.off{background:#fb7185}.hidden{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.app{padding-left:18px;padding-right:18px}.sheetbox{border-radius:27px;margin-bottom:18px;border-bottom:1px solid #303746}}

<script>
(function(){'use strict';
var root=document.getElementById('root'),nav=document.getElementById('nav'),sheet=document.getElementById('sheet'),ask=document.getElementById('ask'),send=document.getElementById('send');
var main='home',route='home',stack=[];var KEY='razi.os.full.1';
var defaultState={events:[],tasks:[],subjects:[{name:'Cybersecurity',progress:72,grade:78},{name:'Networking',progress:61,grade:74},{name:'Programming',progress:68,grade:81},{name:'Mathematics',progress:58,grade:69}],assignments:[],matches:[],rackets:[{name:'Oxdog Ultimate Pro Light',power:8.3,control:8.1,maneuver:9.2},{name:'NOX',power:7.5,control:8.8,maneuver:8.3}],players:[],watch:[],books:[],chat:[],reports:[],custom:[],notes:[],quizScore:0};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{var x=localStorage.getItem(KEY);return x?Object.assign(clone(defaultState),JSON.parse(x)):clone(defaultState)}catch(e){return clone(defaultState)}}var S=load();
var BRIDGE_URL='https://luzupmylqfsqtsgyhliz.supabase.co/functions/v1/razi-bridge',BTK='razi.bridge.token.v1',BWK='razi.bridge.workspace.v1',bridgeBusy=false;
var PUSHK='razi.push.enabled.v1';
function homeScreenMode(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}
function pushFlag(){try{return localStorage.getItem(PUSHK)==='1'}catch(e){return false}}
function setPushFlag(v){try{v?localStorage.setItem(PUSHK,'1'):localStorage.removeItem(PUSHK)}catch(e){}}
function b64ToBytes(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function registerRaziSW(){
  if(!('serviceWorker' in navigator))throw new Error('service_worker_unsupported');
  var reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
  await navigator.serviceWorker.ready;
  return reg
}
async function enablePush(){
  if(!bridgeConnected())return toast('Connect Razi Bridge first');
  if(!homeScreenMode()){
    sheet.innerHTML='<div class="sheet" onclick="if(event.target===this)R.close()"><div class="sheetbox"><div class="ey">IPHONE PUSH</div><h2>Add Razi OS to Home Screen</h2><div class="muted">On iPhone, push notifications work when Razi OS is opened from its Home Screen icon. In Safari tap Share → Add to Home Screen, then open Razi OS from the new icon and tap Enable Push again.</div><button class="btn" style="width:100%;margin-top:12px" onclick="R.close()">Got it</button></div></div>';return
  }
  if(!('Notification' in window)||!('PushManager' in window))return toast('Push is not supported here');
  try{
    var reg=await registerRaziSW();
    var permission=Notification.permission;
    if(permission!=='granted')permission=await Notification.requestPermission();
    if(permission!=='granted'){setPushFlag(false);return toast('Notifications not allowed')}
    var cfg=await bridgeCall('pushConfig');
    var sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(cfg.vapidPublicKey)})
    }
    await bridgeCall('subscribePush',{subscription:sub.toJSON(),deviceName:'Yousef iPhone · Razi OS'});
    setPushFlag(true);toast('Push reminders enabled ✓');render()
  }catch(e){
    setPushFlag(false);
    var m=String(e&&e.message||e);
    toast(m.indexOf('denied')>=0?'Notifications blocked':'Could not enable push')
  }
}
async function disablePush(silent){
  try{
    if('serviceWorker' in navigator){
      var reg=await navigator.serviceWorker.getRegistration('./');
      if(reg&&reg.pushManager){
        var sub=await reg.pushManager.getSubscription();
        if(sub){
          if(bridgeConnected())try{await bridgeCall('unsubscribePush',{endpoint:sub.endpoint})}catch(_e){}
          try{await sub.unsubscribe()}catch(_e){}
        }
      }
    }
  }catch(e){}
  setPushFlag(false);
  if(!silent){toast('Push reminders off');render()}
}
function bridgeToken(){try{return localStorage.getItem(BTK)||''}catch(e){return ''}}
function bridgeConnected(){return !!bridgeToken()}
async function bridgeCall(action,payload,noToken){
  var h={'Content-Type':'application/json'},tok=bridgeToken();
  if(tok&&!noToken)h['x-razi-session']=tok;
  var r=await fetch(BRIDGE_URL,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},payload||{}))});
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('bridge_'+r.status));
  return d
}
function mapEvent(x){return {cloudId:x.id,title:x.title||'Untitled',when:x.start_at?fmtDate(x.start_at):'Cloud event',type:x.category==='personal'?'life':(x.category||'life'),location:x.location||'',cloud:true}}
function mapTask(x){return {cloudId:x.id,title:x.title||'Task',due:x.due_at?fmtDate(x.due_at):'',done:!!x.completed_at||x.status==='done',cloud:true}}
function mapMatch(x){return {cloudId:x.id,title:x.title||x.opponent||'Padel match',score:x.score||'',smash:x.smash||5,lob:x.lob||5,win:!!x.win,cloud:true}}
function mergeCloud(local,remote){var clean=(local||[]).filter(function(x){return !x.cloudId});return clean.concat(remote||[])}
async function syncCloud(silent){
  if(!bridgeConnected()||bridgeBusy)return false;
  bridgeBusy=true;
  try{
    var d=await bridgeCall('snapshot');
    S.events=mergeCloud(S.events,(d.events||[]).map(mapEvent));
    S.tasks=mergeCloud(S.tasks,(d.tasks||[]).map(mapTask));
    if(d.matches&&d.matches.length)S.matches=mergeCloud(S.matches,d.matches.map(mapMatch));
    if(d.sections&&d.sections.length){
      var cs=d.sections.map(function(x){return {cloudId:x.id,title:x.title||x.name||'Custom section',desc:x.description||'Synced from Razi',cloud:true}});
      S.custom=mergeCloud(S.custom,cs)
    }
    save();if(!silent)toast('Synced with Razi ✓');render();return true
  }catch(e){
    if(String(e.message).indexOf('invalid_session')>=0||String(e.message).indexOf('not_paired')>=0){try{localStorage.removeItem(BTK);localStorage.removeItem(BWK)}catch(_e){}}
    if(!silent)toast('Local mode — sync unavailable');return false
  }finally{bridgeBusy=false}
}
function pairBridge(){
  sheet.innerHTML='<div class="sheet" onclick="if(event.target===this)R.close()"><div class="sheetbox"><div class="ey">RAZI BRIDGE</div><h2>Connect this iPhone</h2><div class="muted">Enter the 6-digit pairing code once. The private session stays only on this device.</div><input id="pairCode" class="field" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="margin-top:12px"><button class="btn" style="width:100%;margin-top:10px" onclick="R.confirmPair()">Connect securely</button><button class="btn sec" style="width:100%;margin-top:8px" onclick="R.close()">Cancel</button></div></div>'
}
async function confirmPair(){
  var c=(document.getElementById('pairCode')||{}).value||'';c=c.trim();
  if(!/^\d{6}$/.test(c))return toast('Enter 6 digits');
  try{
    var d=await bridgeCall('pair',{code:c,deviceName:'Yousef iPhone · Razi OS'},true);
    localStorage.setItem(BTK,d.token);localStorage.setItem(BWK,d.workspaceId||'');close();toast('Connected to Razi ✓');await syncCloud(true);render()
  }catch(e){toast(e.message==='code_not_found'?'Pairing code expired':'Could not connect')}
}
async function disconnectBridge(){if(confirm('Disconnect cloud sync on this device? Your local data will stay.')){await disablePush(true);try{localStorage.removeItem(BTK);localStorage.removeItem(BWK)}catch(e){}toast('Disconnected — local data kept');render()}}
async function cloudEvent(title,w,ty){
  if(!bridgeConnected()||!w)return;
  try{await bridgeCall('createEvent',{title:title,start_at:new Date(w).toISOString(),category:ty==='life'?'personal':ty,reminder_minutes:[5]});await syncCloud(true)}catch(e){}
}
async function cloudTask(title,due){
  if(!bridgeConnected())return;
  var iso=null;if(due){try{iso=new Date(due+'T12:00:00').toISOString()}catch(e){}}
  try{await bridgeCall('createTask',{title:title,due_at:iso,category:'general'});await syncCloud(true)}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1600)}

function askText(t){t=(t||'').trim();if(!t)return;S.chat.push({who:'u',text:t});if(/دراس|study/i.test(t)&&/افتح|ودني|open/i.test(t)){S.chat.push({who:'r',text:'Opening Study.'});save();setMain('study');return}if(/بادل|padel/i.test(t)&&/افتح|ودني|open/i.test(t)){S.chat.push({who:'r',text:'Opening Padel.'});save();setMain('padel');return}if(/اخبار|أخبار|news|pulse/i.test(t)){S.chat.push({who:'r',text:'Opening Pulse.'});save();open('pulse');return}if(/طلعة|طلعه|كلاس|موعد|deadline|ديدلاين|assignment|مباراة|مباراه/i.test(t)){var ty=/كلاس|assignment|deadline|ديدلاين/i.test(t)?'study':/بادل|مباراة|مباراه/i.test(t)?'padel':'life';S.events.unshift({title:t,when:'Added by Razi',type:ty});S.chat.push({who:'r',text:'Added to your day ✓'});save();setMain('razi');return}S.chat.push({who:'r',text:'I saved your request. Full natural-language reasoning needs the secure AI backend; local navigation and scheduling are active now.'});save();setMain('razi')}

function addTask(){sheet.innerHTML='<div class="sheet"><div class="sheetbox"><h2>Add task</h2><input id="taskt" class="field" placeholder="Task"><input id="taskd" class="field" type="date" style="margin-top:9px"><button class="btn" style="width:100%;margin-top:9px" onclick="R.saveTask()">Add</button><button class="btn sec" style="width:100%;margin-top:8px" onclick="R.close()">Cancel</button></div></div>'}function saveTask(){var t=document.getElementById('taskt').value.trim();if(!t)return;var d=document.getElementById('taskd').value;S.tasks.unshift({title:t,due:d,done:false});save();close();render();cloudTask(t,d)}function toggleTask(i){S.tasks[i].done=!S.tasks[i].done;save();render()}

function previewVideo(el){var f=el.files&&el.files[0];if(!f)return;var u=URL.createObjectURL(f);document.getElementById('videoPreview').innerHTML='<video class="thumb" controls src="'+u+'"></video>'}function previewTT(el){var f=el.files&&el.files[0];if(!f)return;var out=document.getElementById('ttpreview');if(f.type.indexOf('image/')===0){var u=URL.createObjectURL(f);out.innerHTML='<div style="padding:12px"><img class="thumb" src="'+u+'"><div class="muted" style="margin-top:8px">'+esc(f.name)+' selected. Confirm times manually or send the image to the AI backend when connected.</div></div>'}else out.innerHTML=row('📄',esc(f.name),'PDF selected.','')}

function loadNews(kind,btn){if(btn){var ts=document.querySelectorAll('.tab');for(var i=0;i<ts.length;i++)ts[i].classList.remove('on');btn.classList.add('on')}var el=document.getElementById('news');if(!el)return;el.innerHTML='<div class="empty">Loading headlines…</div>';fetch('/api/news?kind='+encodeURIComponent(kind)).then(function(r){return r.json()}).then(function(d){var arr=d.items||[];el.innerHTML=arr.length?arr.slice(0,15).map(function(n){return '<a class="newslink" href="'+esc(n.link)+'" target="_blank"><div class="mediaRow"><div class="rmain"><div class="rt">'+esc(n.title)+'</div><div class="rs">'+esc(n.source||'')+' · '+esc(n.when||'')+'</div></div><span class="arr">›</span></div></a>'}).join(''):'<div class="empty">No headlines available.</div>'}).catch(function(){el.innerHTML='<div class="empty">Live headlines are unavailable right now.</div>'})}
function searchAnime(){var q=document.getElementById('animeQ').value.trim(),el=document.getElementById('animeResults');if(!q)return;el.innerHTML='<div class="empty">Searching…</div>';fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'query($s:String){Page(perPage:12){media(search:$s,type:ANIME,sort:POPULARITY_DESC){id title{romaji english} episodes status genres coverImage{medium} description(asHtml:false)}}}',variables:{s:q}})}).then(function(r){return r.json()}).then(function(d){var a=d.data.Page.media||[];el.innerHTML=a.map(function(x){return '<div class="mediaRow"><img class="cover" src="'+esc(x.coverImage.medium)+'"><div class="rmain"><div class="rt">'+esc(x.title.english||x.title.romaji)+'</div><div class="rs">'+esc((x.genres||[]).slice(0,3).join(' · '))+' · '+(x.episodes||'?')+' eps · '+esc(x.status||'')+'</div><button class="pill" style="margin-top:8px" onclick="R.addWatch(\''+esc((x.title.english||x.title.romaji).replace(/'/g,"\\'") )+'\')">+ Watchlist</button></div></div>'}).join('')||'<div class="empty">No results.</div>'}).catch(function(){el.innerHTML='<div class="empty">Anime search unavailable right now.</div>'})}
function searchBooks(){var q=document.getElementById('bookQ').value.trim(),el=document.getElementById('bookResults');if(!q)return;el.innerHTML='<div class="empty">Searching…</div>';fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10').then(function(r){return r.json()}).then(function(d){var a=d.items||[];el.innerHTML=a.map(function(it){var v=it.volumeInfo||{},im=v.imageLinks&&v.imageLinks.thumbnail||'';return '<div class="mediaRow">'+(im?'<img class="cover" src="'+esc(im.replace('http:','https:'))+'">':'')+'<div class="rmain"><div class="rt">'+esc(v.title||'Untitled')+'</div><div class="rs">'+esc((v.authors||[]).join(', '))+' · '+(v.pageCount||'?')+' pages</div><button class="pill" style="margin-top:8px" onclick="R.saveBook(\''+esc((v.title||'Untitled').replace(/'/g,"\\'"))+'\',\''+esc(((v.authors||[]).join(', ')).replace(/'/g,"\\'"))+'\')">Want to read</button></div></div>'}).join('')||'<div class="empty">No results.</div>'}).catch(function(){el.innerHTML='<div class="empty">Book search unavailable right now.</div>'})}
function searchTV(){var el=document.getElementById('tvResults');el.innerHTML='<div class="empty">Loading…</div>';fetch('https://api.tvmaze.com/search/shows?q=supernatural').then(function(r){return r.json()}).then(function(a){el.innerHTML=a.slice(0,10).map(function(x){var s=x.show;return '<div class="mediaRow">'+(s.image?'<img class="cover" src="'+esc(s.image.medium)+'">':'')+'<div class="rmain"><div class="rt">'+esc(s.name)+'</div><div class="rs">'+esc((s.genres||[]).join(' · '))+' · '+esc(s.language||'')+'</div><button class="pill" style="margin-top:8px" onclick="R.addWatch(\''+esc(s.name.replace(/'/g,"\\'"))+'\')">+ Watchlist</button></div></div>'}).join('')}).catch(function(){el.innerHTML='<div class="empty">Series search unavailable.</div>'})}
function loadSteam(){var el=document.getElementById('steam');if(!el)return;fetch('/api/steam').then(function(r){return r.json()}).then(function(d){var a=d.items||[];el.innerHTML=a.length?a.slice(0,10).map(function(x){return '<div class="mediaRow">'+(x.image?'<img class="cover" style="width:110px;height:62px" src="'+esc(x.image)+'">':'')+'<div class="rmain"><div class="rt">'+esc(x.name)+'</div><div class="rs">'+esc(x.price||'')+'</div></div></div>'}).join(''):'<div class="empty">No Steam data.</div>'}).catch(function(){el.innerHTML='<div class="empty">Steam data unavailable.</div>'})}

function storyLookup(){var q=document.getElementById('storyQ').value.trim(),el=document.getElementById('storyResults');if(!q)return;el.innerHTML='<div class="empty">Searching…</div>';fetch('https://en.wikipedia.org/w/api.php?action=query&origin=*&format=json&prop=extracts&exintro=1&explaintext=1&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=5').then(function(r){return r.json()}).then(function(d){var p=d.query&&d.query.pages?Object.keys(d.query.pages).map(function(k){return d.query.pages[k]}):[];el.innerHTML=p.map(function(x){return '<div class="mediaRow"><div class="rmain"><div class="rt">'+esc(x.title)+'</div><div class="rs">'+esc((x.extract||'').slice(0,380))+'</div></div></div>'}).join('')||'<div class="empty">No results.</div>'}).catch(function(){el.innerHTML='<div class="empty">Search unavailable.</div>'})}

function pick(){sheet.innerHTML='<div class="sheet"><div class="sheetbox"><h2>Pick for me</h2><div class="form"><select id="pickType" class="field"><option>Anime</option><option>Movie</option><option>Series</option><option>Book</option></select><select id="pickMood" class="field"><option>OP main character</option><option>Fast action</option><option>Romance</option><option>Fantasy</option><option>Relaxing</option><option>Plot twist</option></select><button class="btn" onclick="R.pickDone()">Find my section</button></div></div></div>'}function pickDone(){var t=document.getElementById('pickType').value,m=document.getElementById('pickMood').value;close();S.chat.push({who:'u',text:'Recommend '+t+' · '+m});S.chat.push({who:'r',text:'I saved your preference. Open '+t+' to use the live catalogue available in this build.'});save();if(t==='Anime')open('anime');else if(t==='Book')open('books');else if(t==='Series')open('series');else open('movies')}

var reactTimer=0,reactStart=0,reactReady=false;function reactTap(){var b=document.getElementById('react'),t=document.getElementById('reactText');if(!reactTimer&&!reactReady){b.textContent='WAIT';reactTimer=setTimeout(function(){reactTimer=0;reactReady=true;reactStart=performance.now();b.textContent='GO!';b.style.background='#eef1ff';b.style.color='#08090c';t.textContent='Tap now!'},900+Math.random()*2200);return}if(reactTimer){clearTimeout(reactTimer);reactTimer=0;b.textContent='START';t.textContent='Too early 😭';return}if(reactReady){var ms=Math.round(performance.now()-reactStart);reactReady=false;b.textContent='START';b.style.background='';b.style.color='';t.textContent=ms+' ms';}}
var memTarget=[],memScore=0,memAccept=false;function memStart(){memTarget=[];memAccept=false;for(var i=0;i<9;i++)document.getElementById('m'+i).classList.remove('on');while(memTarget.length<3){var n=Math.floor(Math.random()*9);if(memTarget.indexOf(n)<0)memTarget.push(n)}memTarget.forEach(function(n){document.getElementById('m'+n).classList.add('on')});setTimeout(function(){memTarget.forEach(function(n){document.getElementById('m'+n).classList.remove('on')});memAccept=true},1000)}function memTap(i){if(!memAccept)return;if(memTarget.indexOf(i)>=0){document.getElementById('m'+i).classList.add('on');memTarget=memTarget.filter(function(x){return x!==i});if(!memTarget.length){memScore++;memAccept=false;document.getElementById('memText').textContent='Score '+memScore+' ✓'}}else{memScore=0;memAccept=false;document.getElementById('memText').textContent='Missed. Score reset.'}}
var rushNext=1,rushStartAt=0;function rushStart(){var nums=[1,2,3,4,5,6,7,8,9];nums.sort(function(){return Math.random()-.5});document.getElementById('rush').innerHTML=nums.map(function(n){return '<button class="mem" onclick="R.rushTap('+n+',this)">'+n+'</button>'}).join('');rushNext=1;rushStartAt=performance.now();document.getElementById('rushText').textContent='Tap 1'}function rushTap(n,b){if(n!==rushNext)return;b.style.visibility='hidden';rushNext++;if(rushNext===10)document.getElementById('rushText').textContent=Math.round(performance.now()-rushStartAt)+' ms';else document.getElementById('rushText').textContent='Tap '+rushNext}
